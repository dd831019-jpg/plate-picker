name: 每日更新車牌資料

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 每 15 分鐘檢查一次；car16 沒更新時不會提交
  workflow_dispatch:                 # 也可以在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: update-plates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 從 car16 抓取選牌與標牌資料
        run: |
          cp -r data "$RUNNER_TEMP/prev"
          python3 scripts/update_plates.py "$PWD/data" "$RUNNER_TEMP/prev"

      - name: 有變動才提交
        run: |
          # 只比較號碼與公告；抓取時間 updatedAt 每次都會變，不算變動
          if python3 -I - "$RUNNER_TEMP/prev" data <<'EOF'
          import json, sys
          for g in ("car", "moto"):
              a = json.load(open(f"{sys.argv[1]}/{g}.json", encoding="utf-8"))
              b = json.load(open(f"{sys.argv[2]}/{g}.json", encoding="utf-8"))
              a.pop("updatedAt", None); b.pop("updatedAt", None)
              if a != b:
                  sys.exit(1)
          EOF
          then
            echo "car16 資料沒有變動，不提交"
            exit 0
          fi
          git config user.name "plates-bot"
          git config user.email "plates-bot@users.noreply.github.com"
          git add data
          git commit -m "資料更新 $(TZ=Asia/Taipei date '+%F %H:%M')"
          git push
