name: 每日更新車牌資料

on:
  schedule:
    - cron: "17 * * * *"   # 每小時第 17 分檢查一次；car16 沒更新時不會提交
  workflow_dispatch:         # 也可以在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: update-plates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 從 car16 抓取選牌與標牌資料
        run: |
          cp plates.json "$RUNNER_TEMP/prev.json"
          python3 scripts/update_plates.py "$PWD/plates.json" "$RUNNER_TEMP/prev.json"

      - name: 有變動才提交
        run: |
          # 只比較號碼與公告；抓取時間 updatedAt 每次都會變，不算變動
          if python3 -I -c 'import json,sys; a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2])); [x.pop("updatedAt",None) for x in (a,b)]; sys.exit(0 if a==b else 1)' "$RUNNER_TEMP/prev.json" plates.json; then
            echo "car16 資料沒有變動，不提交"
            exit 0
          fi
          git config user.name "plates-bot"
          git config user.email "plates-bot@users.noreply.github.com"
          git add plates.json
          git commit -m "資料更新 $(TZ=Asia/Taipei date '+%F %H:%M')"
          git push
