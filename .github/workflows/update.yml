name: 每日更新車牌資料

on:
  schedule:
    - cron: "8,23,38,53 * * * *"   # 每 15 分鐘檢查一次；car16 沒更新時不會提交
  workflow_dispatch:                 # 也可以在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: update-plates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 從 car16 抓取選牌與標牌資料
        run: |
          cp -r data "$RUNNER_TEMP/prev"
          python3 scripts/update_plates.py "$PWD/data" "$RUNNER_TEMP/prev"

      - name: 有變動才提交
        run: |
          # 只比較號碼與公告；抓取時間 updatedAt 每次都會變，不算變動
          if python3 -I - "$RUNNER_TEMP/prev" data <<'EOF'
          import json, sys
          for g in ("car", "moto"):
              a = json.load(open(f"{sys.argv[1]}/{g}.json", encoding="utf-8"))
              b = json.load(open(f"{sys.argv[2]}/{g}.json", encoding="utf-8"))
              a.pop("updatedAt", None); b.pop("updatedAt", None)
              if a != b:
                  sys.exit(1)
          EOF
          then
            echo "car16 資料沒有變動，不提交"
            exit 0
          fi
          git config user.name "plates-bot"
          git config user.email "plates-bot@users.noreply.github.com"
          cp -r data "$RUNNER_TEMP/new"
          for i in 1 2 3; do
            git add data
            git diff --cached --quiet && exit 0
            git commit -q -m "資料更新 $(TZ=Asia/Taipei date '+%F %H:%M')"
            git push && exit 0
            # 推送失敗（例如剛好有人更新了網頁）：改用最新版本，再放回這次抓到的資料
            sleep 5
            git fetch --depth=1 origin main
            git reset -q --hard FETCH_HEAD
            rm -rf data && cp -r "$RUNNER_TEMP/new" data
          done
          exit 1
